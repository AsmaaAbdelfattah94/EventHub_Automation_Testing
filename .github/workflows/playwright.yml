
name: EventHub UI and API Automation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Prevent runs against the same shared test account
# from interfering with each other.
concurrency:
  group: eventhub-shared-test-account
  cancel-in-progress: false

jobs:
  test:
    name: Playwright UI and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      API_BASE_URL: https://api.eventhub.rahulshettyacademy.com/api/
      API_IGNORE_HTTPS_ERRORS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run UI and API tests
        run: npx playwright test --workers=1 --reporter=html,list
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
